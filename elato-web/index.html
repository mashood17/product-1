<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Warms the DNS/TCP/TLS connection to the backend before the first of
         the ~6 parallel homepage API calls (site-content, hero-backgrounds,
         reviews, instagram, etc.) actually fires — saves a full round trip
         off each of them on a cold connection. %VITE_API_BASE_URL% is Vite's
         own build-time HTML env substitution (see vite.config.ts env docs),
         so this always points at whatever backend the current build was
         configured for; blank in a misconfigured build is a no-op, not an
         error. -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_API_BASE_URL%" />
    <title>ELATŌ | Crafting Moments Worth Savoring</title>
    <meta name="description" content="ELATŌ — a premium dessert café, boutique stay, and celebration destination in Mangalore, India." />
    <script>
      // Every route below is a lazily-loaded chunk, so right after a reload
      // the document is briefly just the nav + an empty fallback + footer.
      // The browser's own automatic scroll restoration runs before that
      // content streams in, clamps to the (still short) bottom, and never
      // revisits it once the page grows — landing the user on the footer.
      // Opting out here, as early as possible, hands restoration to the app
      // (see ScrollPositionRestoration in src/App.tsx), which waits for the
      // real content to mount before scrolling.
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
